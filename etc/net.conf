# Fornax network configuration
# Read by netd at startup. Supports:
#   dhcp                          — obtain IP via DHCP
#   add <ip> <mask> <gateway>     — static IP configuration
#   dns <ip>                      — set DNS nameserver
#
# If this file is missing, netd uses QEMU SLiRP defaults
# (10.0.2.15/24, gateway 10.0.2.2, DNS 10.0.2.3).

# DHCP mode (uncomment to use):
# dhcp

# Static mode (QEMU SLiRP defaults):
add 10.0.2.15 255.255.255.0 10.0.2.2
dns 10.0.2.3

# TCP tuning (Linux-comparable defaults, applied at startup):
# rmem 131072        # RX buffer size per connection (bytes)
# wmem 131072        # TX buffer size per connection (bytes)
# mss 1460           # default MSS
# rto 20             # initial RTO (ticks, 10ms each)
# nodelay 1          # disable delayed ACK (ACK every segment)
# window 65535       # default advertised window
